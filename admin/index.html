<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<title>Curadoria — Panorama IA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
          --ok:#22c55e; --no:#ef4444; --acc:#38bdf8; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:14px 16px; display:flex; align-items:center; gap:10px; z-index:10; }
  header h1 { font-size:17px; margin:0; flex:1; font-weight:600; }
  button { font:inherit; border:0; border-radius:9px; padding:9px 14px; cursor:pointer; font-weight:600; }
  .btn-refresh { background:var(--card); color:var(--txt); border:1px solid var(--line); padding:8px 12px; }
  .btn-buscar { width:100%; background:var(--card); color:var(--acc); border:1px solid var(--acc);
                border-radius:14px; padding:14px 16px; margin-bottom:14px; font-weight:600; font-size:15px; }
  .btn-buscar:hover { background:#16324a; }
  .btn-buscar:disabled { opacity:.5; cursor:default; }
  main { max-width:680px; margin:0 auto; padding:16px; }
  .muted { color:var(--mut); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 16px; margin-bottom:14px; }
  .top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .emp { font-weight:700; font-size:16px; }
  .date { color:var(--mut); font-size:13px; }
  .mod { font-size:15px; margin:2px 0 8px; }
  .impacto { color:#cbd5e1; font-size:14px; line-height:1.45; margin:0 0 10px; }
  .badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; letter-spacing:.3px; }
  .badge-new { background:rgba(245,158,11,.15); color:var(--warn); border:1px solid var(--warn); }
  .ref a { color:var(--acc); font-size:13px; text-decoration:none; }
  .ref a:hover { text-decoration:underline; }
  .actions { display:flex; gap:10px; margin-top:12px; }
  .btn-ok { background:var(--ok); color:#06210f; flex:1; }
  .btn-no { background:var(--no); color:#2a0808; flex:1; }
  .actions button:disabled { opacity:.5; cursor:default; }
  .spinner { display:inline-block; width:13px; height:13px; vertical-align:-2px; margin-right:7px;
             border:2px solid rgba(0,0,0,.25); border-top-color:currentColor; border-radius:50%;
             animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .card.busy { opacity:.7; pointer-events:none; }
  .empty { text-align:center; color:var(--mut); padding:48px 16px; }
  .token-box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .token-box input { width:100%; padding:11px; border-radius:9px; border:1px solid var(--line);
                     background:#0b1220; color:var(--txt); font:inherit; margin:10px 0; }
  .token-box .btn-ok { width:100%; }
  .row-link { display:flex; gap:14px; margin-top:18px; font-size:13px; }
  .row-link a { color:var(--mut); text-decoration:none; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(80px);
           background:#0b1220; border:1px solid var(--line); color:var(--txt);
           padding:11px 18px; border-radius:10px; transition:transform .25s; max-width:90%; z-index:50; }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast.err { border-color:var(--no); }
</style>
</head>
<body>
<header>
  <h1>Curadoria · Pendentes</h1>
  <button class="btn-refresh" id="diag" title="Testar latência do web app">⏱</button>
  <button class="btn-refresh" id="refresh" title="Recarregar">↻</button>
</header>

<main id="main">
  <button class="btn-buscar" id="buscar" title="Disparar a pesquisa semanal de lançamentos (workflow do GitHub Actions)">🔍 Buscar novos lançamentos</button>
  <div class="muted" id="status">Carregando…</div>
  <div id="list"></div>
</main>

<div id="toast"></div>

<!-- data.js do próprio site: dá CONFIG.SHEET_ID e COMPANY_COLORS (empresas conhecidas) -->
<script src="../assets/data.js"></script>
<script>
(function () {
  "use strict";
  // URL do Apps Script web app (protegido pelo token; o endpoint em si não é segredo).
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKKRVZ38ThBgdtSqpjz0aJiBHAAsipP3M7KWumZw9aOm7eaRmsInt06fld92VN7Too/exec";
  var TAB = "Pendentes";
  var TOKEN_KEY = "panorama-admin-token";

  var SHEET_ID = (typeof CONFIG !== "undefined" && CONFIG.SHEET_ID) ? CONFIG.SHEET_ID : "";
  var KNOWN = {};
  try { Object.keys(COMPANY_COLORS).forEach(function (k) { KNOWN[k.trim().toUpperCase()] = true; }); } catch (e) {}

  var listEl = document.getElementById("list");
  var statusEl = document.getElementById("status");
  var toastEl = document.getElementById("toast");

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }

  function toast(msg, isErr, ms) {
    toastEl.textContent = msg;
    toastEl.className = isErr ? "show err" : "show";
    setTimeout(function () { toastEl.className = ""; }, ms || 2600);
  }

  // ── Leitura ao vivo do web app via fetch CORS (sem cache do gviz) ──
  // action=listar → {candidatos:[...]}; action=ping → {ok,execMs,pendentesRows}. Sem token
  // (Pendentes já é publicamente legível via gviz; listar não vaza nada novo). O Apps Script
  // responde com Access-Control-Allow-Origin: * (inclusive no 302 → googleusercontent),
  // então o fetch CORS lê o JSON direto. JSONP-via-<script> NÃO funciona aqui: a tag <script>
  // falha no redirect pro googleusercontent ("load failed").
  function webAppGet(action) {
    var url = APPS_SCRIPT_URL + "?action=" + encodeURIComponent(action);
    return withTimeout(fetch(url, { method: "GET", mode: "cors", redirect: "follow", cache: "no-store" }), 20000)
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); });
  }

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  async function loadPendentes() {
    statusEl.textContent = "Carregando pendentes…";
    listEl.innerHTML = "";
    var data;
    try { data = await webAppGet("listar"); }
    catch (e) { statusEl.textContent = "Falha ao ler pendentes (" + e.message + ")."; return; }

    var raw = (data && Array.isArray(data.candidatos)) ? data.candidatos : [];
    var items = [];
    for (var i = 0; i < raw.length; i++) {
      var it = raw[i];
      if (!it || !it.data || !it.empresa || !it.modelo) continue;
      items.push({ date: it.data, emp: it.empresa, mod: it.modelo, impacto: it.impacto || "", ref: it.referencia || "" });
    }

    if (!items.length) {
      statusEl.textContent = "";
      listEl.innerHTML = '<div class="empty">✅ Nenhum lançamento pendente.<br><span class="muted">Quando o pipeline rodar, eles aparecem aqui.</span>' + linksHtml() + "</div>";
      return;
    }
    statusEl.textContent = items.length + " pendente(s):";
    listEl.innerHTML = items.map(card).join("") + '<div class="row-link">' + linksHtml() + "</div>";
  }

  function linksHtml() {
    return '<a href="https://lapig-ufg.github.io/app-panorama-global-da-ia-generativa/" target="_blank" rel="noopener">Ver o site ↗</a>' +
           ' <a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '" target="_blank" rel="noopener">Abrir planilha ↗</a>';
  }

  function card(it) {
    var nova = !KNOWN[it.emp.trim().toUpperCase()];
    var id = btoa(unescape(encodeURIComponent(it.date + "|" + it.emp + "|" + it.mod))).replace(/=/g, "");
    return '' +
      '<div class="card" data-id="' + id + '">' +
        '<div class="top">' +
          '<span class="emp">' + esc(it.emp) + '</span>' +
          (nova ? '<span class="badge badge-new">EMPRESA NOVA</span>' : "") +
          '<span class="date">' + esc(it.date) + '</span>' +
        '</div>' +
        '<div class="mod">' + esc(it.mod) + '</div>' +
        (it.impacto ? '<p class="impacto">' + esc(it.impacto) + "</p>" : "") +
        (it.ref ? '<div class="ref"><a href="' + esc(it.ref) + '" target="_blank" rel="noopener">fonte ↗</a></div>' : "") +
        (nova ? '<p class="impacto" style="color:#f59e0b">⚠ Aplique o snippet em <b>data.js</b> (logo/cor/grupo) e suba o <b>?v=</b> antes de aprovar, senão a pílula sai sem logo.</p>' : "") +
        '<div class="actions">' +
          '<button class="btn-ok">✓ Aprovar</button>' +
          '<button class="btn-no">✕ Rejeitar</button>' +
        "</div>" +
      "</div>";
  }

  // ── ação aprovar/rejeitar → POST text/plain (sem preflight CORS) ──
  var busy = false; // trava global: só uma ação por vez (evita clique duplo)

  // O Apps Script responde por um redirect entre domínios do Google que o navegador
  // muitas vezes não consegue ler — o fetch pode ficar pendurado. Por isso NÃO
  // confiamos na resposta do POST: disparamos e depois CONFIRMAMOS pelo estado real
  // (listar, ao vivo e sem cache). O card só some se a linha realmente saiu de Pendentes.
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, ms); })
    ]);
  }

  async function act(action, it, cardEl) {
    if (busy) return;
    busy = true;
    var btns = cardEl.querySelectorAll("button");
    var clicked = cardEl.querySelector(action === "aprovar" ? ".btn-ok" : ".btn-no");
    var label = clicked.innerHTML; // guarda p/ restaurar se não confirmar
    btns.forEach(function (b) { b.disabled = true; });
    cardEl.classList.add("busy");
    clicked.innerHTML = '<span class="spinner"></span>Enviando…';

    var payload = { action: action, token: getToken(), data: it.date, empresa: it.emp, modelo: it.mod };

    // Dispara o POST. A resposta do Apps Script costuma ser ilegível (redirect do Google),
    // então NÃO dependemos dela — confirmamos pelo estado real (listar, ao vivo).
    try {
      await withTimeout(fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
      }), 30000);
    } catch (e) { /* timeout/CORS: o servidor pode estar processando — confirmamos abaixo */ }

    // Reconcilia: o card só some se a linha REALMENTE saiu de Pendentes.
    // (aprovar e rejeitar ambos removem de Pendentes, então o teste serve para os dois.)
    var norm = function (s) { return String(s).trim().toUpperCase(); };
    var alvo = it.date + "|" + norm(it.emp) + "|" + norm(it.mod);
    var prazos = [2000, 4000, 6000, 8000, 10000]; // tenta em intervalos crescentes (~30s total)
    var confirmou = false;
    for (var i = 0; i < prazos.length; i++) {
      clicked.innerHTML = '<span class="spinner"></span>Confirmando… (' + (i + 1) + "/" + prazos.length + ")";
      await new Promise(function (r) { setTimeout(r, prazos[i]); });
      var res;
      try { res = await webAppGet("listar"); } catch (e) { continue; }
      var ainda = (res && Array.isArray(res.candidatos))
        ? res.candidatos.some(function (c) { return (c.data + "|" + norm(c.empresa) + "|" + norm(c.modelo)) === alvo; })
        : false;
      if (!ainda) { confirmou = true; break; }
    }

    busy = false;
    if (confirmou) {
      clicked.innerHTML = action === "aprovar" ? "✓ Aprovado" : "✓ Rejeitado";
      cardEl.style.opacity = ".4";
      toast(action === "aprovar" ? "✓ Aprovado e publicado" : "✓ Rejeitado");
      setTimeout(function () {
        if (cardEl.parentNode) cardEl.parentNode.removeChild(cardEl);
        var n = listEl.querySelectorAll(".card").length;
        if (!n) { statusEl.textContent = ""; listEl.innerHTML = '<div class="empty">✅ Nenhum lançamento pendente.' + linksHtml() + "</div>"; }
        else statusEl.textContent = n + " pendente(s):";
      }, 900);
    } else {
      // A linha continua lá: o script ainda está processando (cold start) OU o POST falhou.
      clicked.innerHTML = label;
      cardEl.classList.remove("busy");
      btns.forEach(function (b) { b.disabled = false; });
      toast("Não confirmado ainda (processando?). Recarregue ↻ e tente de novo.", true);
    }
  }

  // ── token gate ──
  function askToken() {
    statusEl.textContent = "";
    listEl.innerHTML =
      '<div class="token-box">' +
        "<p>Cole o <b>token de curadoria</b> uma vez. Fica salvo neste aparelho (localStorage).</p>" +
        '<input id="tok" type="password" placeholder="token…" autocomplete="off">' +
        '<button class="btn-ok" id="saveTok">Salvar e entrar</button>' +
      "</div>";
    document.getElementById("saveTok").onclick = function () {
      var v = document.getElementById("tok").value.trim();
      if (!v) return;
      setToken(v);
      loadPendentes();
    };
  }

  // delegação dos botões dos cards
  listEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var cardEl = ev.target.closest(".card"); if (!cardEl) return;
    // recompõe o item a partir do DOM (robusto)
    var emp = cardEl.querySelector(".emp").textContent;
    var mod = cardEl.querySelector(".mod").textContent;
    var date = cardEl.querySelector(".date").textContent;
    var item = { emp: emp, mod: mod, date: date };
    if (b.classList.contains("btn-ok")) act("aprovar", item, cardEl);
    else if (b.classList.contains("btn-no")) {
      if (confirm("Rejeitar e remover este pendente?\n\n" + emp + " · " + mod)) act("rejeitar", item, cardEl);
    }
  });

  document.getElementById("refresh").onclick = function () { getToken() ? loadPendentes() : askToken(); };

  // ── diagnóstico: mede a latência real do web app (cold start + exec) sem efeito colateral ──
  async function runDiag() {
    if (busy) return;
    toast("Testando web app…");
    var t0 = Date.now();
    var res;
    try { res = await webAppGet("ping"); }
    catch (e) { toast("Falha: " + e.message, true, 6000); return; }
    var rt = Date.now() - t0;
    toast("Web app " + rt + "ms · script " + (res && res.execMs != null ? res.execMs : "?") +
          "ms · pendentes " + (res && res.pendentesRows != null ? res.pendentesRows : "?"), false, 8000);
  }
  document.getElementById("diag").onclick = runDiag;

  // ── disparar a pesquisa de lançamentos (workflow do GitHub Actions, via Apps Script) ──
  async function buscarNovos() {
    if (busy) return;
    if (!confirm("Disparar a pesquisa de lançamentos agora?\n\n" +
                 "Ela busca modelos recentes e grava candidatos em Pendentes (você curadoria depois). " +
                 "Demora alguns minutos; o resultado chega por e-mail e aqui no app.")) return;
    busy = true;
    var btn = document.getElementById("buscar");
    var label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Disparando…';
    var payload = { action: "rodar", token: getToken(), dry_run: "false" };
    var errMsg = "";
    try {
      var res = await withTimeout(fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
      }), 45000);
      try { var j = JSON.parse(await res.text()); if (j && j.ok === false) errMsg = j.error || "falhou"; } catch (e) { /* ilegível: assume disparado */ }
    } catch (e) { /* timeout/CORS: o servidor provavelmente disparou — confirmamos por e-mail/pendentes */ }
    busy = false;
    btn.innerHTML = label;
    btn.disabled = false;
    if (errMsg) { toast("Erro: " + errMsg, true, 9000); return; }
    toast("Pesquisa disparada. Em alguns minutos chegam e-mail + novos pendentes (dê ↻ daqui a pouco).", false, 9000);
  }
  document.getElementById("buscar").onclick = buscarNovos;

  // boot
  if (!SHEET_ID) { statusEl.textContent = "Erro: não consegui ler CONFIG.SHEET_ID de data.js."; }
  else if (!getToken()) { askToken(); }
  else { loadPendentes(); }

  // service worker
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ec">
<meta name="robots" content="noindex, nofollow">
<title>Curadoria — Panorama IA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ═══ Panorama IA · Curadoria — tema editorial (espelha o site da régua) ═══ */
  :root {
    --white:#ffffff; --off-white:#f5f3ec; --paper:#fbfaf5; --paper-tint:#f0ede4;
    --ink:#0c0c0c; --ink-light:#3a3833; --ink-muted:#6b6860; --ink-faint:#e6e3d9; --hair:#ebe7dc;
    --accent:#10a37f; --accent-strong:#0d8a6b; --accent-soft:rgba(16,163,127,.10);
    --green-lapig:#429B4D; --warn:#b45309; --warn-soft:rgba(180,83,9,.10);
    --danger:#c0392b; --danger-soft:rgba(192,57,43,.08);
    --mono:'DM Mono','Courier New',monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --shadow-xs:0 1px 2px rgba(15,12,4,.04); --shadow-sm:0 2px 8px rgba(15,12,4,.05);
    --shadow-md:0 6px 24px rgba(15,12,4,.07); --shadow-lg:0 18px 56px rgba(15,12,4,.10);
  }
  *,*::before,*::after { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    background:var(--off-white);
    background-image:
      radial-gradient(ellipse 70% 50% at 0% 0%, rgba(16,163,127,.05), transparent 60%),
      radial-gradient(ellipse 70% 50% at 100% 0%, rgba(60,59,110,.04), transparent 60%);
    color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility; font-feature-settings:'cv11','ss03';
    -webkit-tap-highlight-color:transparent;
    padding:0 0 env(safe-area-inset-bottom);
  }

  /* faixa tricolor (EUA · China · Outros Países) */
  .top-ribbon { display:flex; height:3px; background:var(--ink); }
  .top-ribbon span { flex:1; }
  .top-ribbon .r-west  { background:linear-gradient(90deg,#3C3B6E,#5b59a6); }
  .top-ribbon .r-east  { background:linear-gradient(90deg,#DE2910,#f45142); }
  .top-ribbon .r-world { background:linear-gradient(90deg,#5B53A8,#7a71c9); }

  /* cabeçalho */
  header {
    position:sticky; top:0; z-index:20;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px) saturate(140%); -webkit-backdrop-filter:blur(12px) saturate(140%);
    border-bottom:1px solid var(--ink);
    padding:calc(env(safe-area-inset-top) + 13px) 18px 13px;
    display:flex; align-items:center; gap:12px;
  }
  .header-titlewrap { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
  .header-kicker {
    font-family:var(--mono); font-size:9px; font-weight:500; letter-spacing:.18em;
    text-transform:uppercase; color:var(--green-lapig);
    display:inline-flex; align-items:center; gap:7px;
  }
  .header-kicker::before { content:''; width:16px; height:1.5px; background:var(--green-lapig); flex-shrink:0; }
  header h1 {
    font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1.05;
    text-transform:uppercase; margin:0; color:var(--ink);
  }
  .header-actions { display:flex; gap:8px; flex-shrink:0; }

  /* botões */
  button { font-family:var(--sans); border:0; cursor:pointer; }
  .icon-btn {
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:9px; border:1px solid var(--ink);
    background:var(--white); color:var(--ink); font-size:16px; line-height:1;
    transition:transform .15s, background .15s, box-shadow .15s;
  }
  .icon-btn:hover { background:var(--paper-tint); transform:translateY(-1px); box-shadow:var(--shadow-xs); }
  .icon-btn:active { transform:translateY(0); }

  main { max-width:640px; margin:0 auto; width:100%; padding:18px 18px 8px; flex:1; }
  .muted { color:var(--ink-muted); }
  #status {
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-muted); margin:2px 2px 14px; min-height:1em;
  }

  .btn-buscar {
    width:100%; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--ink); color:#fff; border:1px solid var(--ink);
    border-radius:12px; padding:15px 18px; margin-bottom:18px;
    font-weight:700; font-size:14px; letter-spacing:.01em;
    transition:transform .15s, background .15s, box-shadow .15s;
  }
  .btn-buscar:hover { background:#1c1c1c; transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .btn-buscar:active { transform:translateY(0); }
  .btn-buscar:disabled { opacity:.5; cursor:default; transform:none; box-shadow:none; }

  /* cartões de pendentes */
  .card {
    position:relative; background:var(--white); border:1px solid var(--hair); border-radius:14px;
    padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow-sm);
    transition:box-shadow .2s, transform .2s, border-color .2s;
  }
  .card::before {
    content:''; position:absolute; left:0; top:16px; bottom:16px; width:3px;
    border-radius:0 3px 3px 0; background:var(--accent); opacity:0; transition:opacity .2s;
  }
  .card:hover { box-shadow:var(--shadow-md); border-color:var(--ink-faint); }
  .card:hover::before { opacity:.7; }
  .card.busy { opacity:.6; pointer-events:none; }

  .top { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:8px; }
  .emp { font-weight:800; font-size:15px; letter-spacing:-.01em; color:var(--ink); }
  .date {
    font-family:var(--mono); font-size:10px; color:var(--ink-muted);
    letter-spacing:.06em; text-transform:uppercase; margin-left:auto;
  }
  .badge {
    font-family:var(--mono); font-size:9px; font-weight:500; padding:3px 8px;
    border-radius:100px; letter-spacing:.08em; text-transform:uppercase;
  }
  .badge-new { background:var(--warn-soft); color:var(--warn); border:1px solid rgba(180,83,9,.35); }

  .mod { font-size:16px; font-weight:700; line-height:1.25; letter-spacing:-.01em; margin:2px 0 8px; color:var(--ink); }
  .impacto { font-size:13.5px; line-height:1.55; color:var(--ink-light); margin:0 0 12px; }
  .ref a {
    font-family:var(--mono); font-size:11px; font-weight:500; color:var(--accent);
    text-decoration:none; letter-spacing:.02em; display:inline-flex; align-items:center; gap:4px;
  }
  .ref a:hover { color:var(--accent-strong); text-decoration:underline; }

  .actions { display:flex; gap:8px; margin-top:14px; }
  .actions .btn-ok, .actions .btn-sec, .actions .btn-no { flex:1; }
  /* Três destinos possíveis para um pendente: marco (régua padrão), secundário
     (só na régua ampliada) e rejeitado. O peso visual segue a hierarquia. */
  .btn-sec {
    background:var(--white); color:var(--ink); border:1px dashed var(--accent);
    border-radius:10px; padding:11px 10px; font-weight:700; font-size:13px;
    transition:transform .15s, background .15s;
  }
  .btn-sec:hover { background:var(--accent-soft, #eaf7f2); }
  .btn-sec:active { transform:translateY(1px); }
  .btn-ok {
    background:var(--accent); color:#fff; border:1px solid var(--accent);
    border-radius:10px; padding:11px 16px; font-weight:700; font-size:13.5px;
    transition:transform .15s, background .15s, box-shadow .15s;
  }
  .btn-ok:hover { background:var(--accent-strong); box-shadow:var(--shadow-sm); }
  .btn-ok:active { transform:translateY(1px); }
  .btn-no {
    background:var(--white); color:var(--danger); border:1px solid var(--hair);
    border-radius:10px; padding:11px 16px; font-weight:700; font-size:13.5px;
    transition:transform .15s, background .15s, border-color .15s;
  }
  .btn-no:hover { background:var(--danger-soft); border-color:var(--danger); }
  .btn-no:active { transform:translateY(1px); }
  .actions button:disabled { opacity:.5; cursor:default; transform:none; }

  .spinner {
    display:inline-block; width:13px; height:13px; vertical-align:-2px; margin-right:7px;
    border:2px solid currentColor; border-right-color:transparent; border-radius:50%;
    opacity:.9; animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .empty { text-align:center; color:var(--ink-muted); padding:52px 20px; font-size:14px; line-height:1.6; }
  .empty .muted { display:block; margin-top:6px; font-size:12.5px; }
  .empty a {
    display:inline-block; margin:16px 8px 0; font-family:var(--mono); font-size:11px;
    color:var(--accent); text-decoration:none; letter-spacing:.03em;
  }
  .empty a:hover { color:var(--accent-strong); text-decoration:underline; }

  .token-box { background:var(--white); border:1px solid var(--hair); border-radius:14px; padding:20px; box-shadow:var(--shadow-sm); }
  .token-box p { font-size:13.5px; line-height:1.55; color:var(--ink-light); margin:0; }
  .token-box input {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--hair);
    background:var(--paper); color:var(--ink); font-family:var(--mono); font-size:14px; margin:12px 0;
    transition:border-color .15s, box-shadow .15s;
  }
  .token-box input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .token-box .btn-ok { width:100%; }

  .row-link { display:flex; gap:16px; margin-top:22px; justify-content:center; flex-wrap:wrap; }
  .row-link a {
    font-family:var(--mono); font-size:11px; color:var(--ink-muted); text-decoration:none;
    letter-spacing:.03em; transition:color .15s;
  }
  .row-link a:hover { color:var(--accent); }

  #toast {
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px);
    transform:translateX(-50%) translateY(90px);
    background:rgba(12,12,12,.95);
    backdrop-filter:blur(12px) saturate(140%); -webkit-backdrop-filter:blur(12px) saturate(140%);
    color:#fff; border:1px solid rgba(255,255,255,.10);
    padding:12px 18px; border-radius:12px; font-size:13px; line-height:1.4;
    max-width:calc(100% - 32px); z-index:50; box-shadow:var(--shadow-lg);
    transition:transform .28s cubic-bezier(.16,1,.3,1);
  }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast.err { border-color:rgba(192,57,43,.6); }

  .app-footer {
    border-top:1px solid var(--hair);
    padding:16px 18px calc(env(safe-area-inset-bottom) + 16px);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-muted); text-align:center; line-height:1.6;
  }
  .app-footer a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--hair); transition:color .15s, border-color .15s; }
  .app-footer a:hover { color:var(--accent); border-bottom-color:var(--accent); }

  /* entradas suaves */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .top-ribbon { animation:fadeInUp .4s ease-out backwards; }
  main { animation:fadeInUp .5s ease-out .1s backwards; }

  @media (max-width:480px) {
    header h1 { font-size:17px; }
    main { padding:16px 14px 8px; }
    .card { padding:14px 16px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<div class="top-ribbon" aria-hidden="true">
  <span class="r-west"></span><span class="r-east"></span><span class="r-world"></span>
</div>
<header>
  <div class="header-titlewrap">
    <span class="header-kicker">Panorama IA · Curadoria</span>
    <h1>Pendentes</h1>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="diag" type="button" title="Testar latência do web app" aria-label="Testar latência do web app">⏱</button>
    <button class="icon-btn" id="refresh" type="button" title="Recarregar" aria-label="Recarregar">↻</button>
  </div>
</header>

<main id="main">
  <button class="btn-buscar" id="buscar" title="Disparar a pesquisa semanal de lançamentos (workflow do GitHub Actions)">🔍 Buscar novos lançamentos</button>
  <div class="muted" id="status">Carregando…</div>
  <div id="list"></div>
</main>

<footer class="app-footer">
  Desenvolvido por Victor Amaral, <a href="https://lapig.iesa.ufg.br/" target="_blank" rel="noopener">LAPIG</a> · IESA · UFG<br>
  Curadoria do Panorama Global da IA Generativa
</footer>

<div id="toast"></div>

<!-- data.js do próprio site: dá CONFIG.SHEET_ID e COMPANY_COLORS (empresas conhecidas) -->
<script src="../assets/data.js"></script>
<script>
(function () {
  "use strict";
  // URL do Apps Script web app (protegido pelo token; o endpoint em si não é segredo).
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKKRVZ38ThBgdtSqpjz0aJiBHAAsipP3M7KWumZw9aOm7eaRmsInt06fld92VN7Too/exec";
  var TAB = "Pendentes";
  var TOKEN_KEY = "panorama-admin-token";

  var SHEET_ID = (typeof CONFIG !== "undefined" && CONFIG.SHEET_ID) ? CONFIG.SHEET_ID : "";
  var KNOWN = {};
  try { Object.keys(COMPANY_COLORS).forEach(function (k) { KNOWN[k.trim().toUpperCase()] = true; }); } catch (e) {}

  var listEl = document.getElementById("list");
  var statusEl = document.getElementById("status");
  var toastEl = document.getElementById("toast");

  function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }

  function toast(msg, isErr, ms) {
    toastEl.textContent = msg;
    toastEl.className = isErr ? "show err" : "show";
    setTimeout(function () { toastEl.className = ""; }, ms || 2600);
  }

  // ── Leitura ao vivo do web app via fetch CORS (sem cache do gviz) ──
  // action=listar → {candidatos:[...]}; action=ping → {ok,execMs,pendentesRows}. Sem token
  // (Pendentes já é publicamente legível via gviz; listar não vaza nada novo). O Apps Script
  // responde com Access-Control-Allow-Origin: * (inclusive no 302 → googleusercontent),
  // então o fetch CORS lê o JSON direto. JSONP-via-<script> NÃO funciona aqui: a tag <script>
  // falha no redirect pro googleusercontent ("load failed").
  function webAppGet(action) {
    var url = APPS_SCRIPT_URL + "?action=" + encodeURIComponent(action);
    return withTimeout(fetch(url, { method: "GET", mode: "cors", redirect: "follow", cache: "no-store" }), 20000)
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); });
  }

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  async function loadPendentes() {
    statusEl.textContent = "Carregando pendentes…";
    listEl.innerHTML = "";
    var data;
    try { data = await webAppGet("listar"); }
    catch (e) { statusEl.textContent = "Falha ao ler pendentes (" + e.message + ")."; return; }

    var raw = (data && Array.isArray(data.candidatos)) ? data.candidatos : [];
    var items = [];
    for (var i = 0; i < raw.length; i++) {
      var it = raw[i];
      if (!it || !it.data || !it.empresa || !it.modelo) continue;
      items.push({ date: it.data, emp: it.empresa, mod: it.modelo, impacto: it.impacto || "", ref: it.referencia || "" });
    }

    if (!items.length) {
      statusEl.textContent = "";
      listEl.innerHTML = '<div class="empty">✅ Nenhum lançamento pendente.<br><span class="muted">Quando o pipeline rodar, eles aparecem aqui.</span>' + linksHtml() + "</div>";
      return;
    }
    statusEl.textContent = items.length + " pendente(s):";
    listEl.innerHTML = items.map(card).join("") + '<div class="row-link">' + linksHtml() + "</div>";
  }

  function linksHtml() {
    return '<a href="https://lapig-ufg.github.io/app-panorama-global-da-ia-generativa/" target="_blank" rel="noopener">Ver o site ↗</a>' +
           ' <a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '" target="_blank" rel="noopener">Abrir planilha ↗</a>';
  }

  function card(it) {
    var nova = !KNOWN[it.emp.trim().toUpperCase()];
    var id = btoa(unescape(encodeURIComponent(it.date + "|" + it.emp + "|" + it.mod))).replace(/=/g, "");
    return '' +
      '<div class="card" data-id="' + id + '">' +
        '<div class="top">' +
          '<span class="emp">' + esc(it.emp) + '</span>' +
          (nova ? '<span class="badge badge-new">EMPRESA NOVA</span>' : "") +
          '<span class="date">' + esc(it.date) + '</span>' +
        '</div>' +
        '<div class="mod">' + esc(it.mod) + '</div>' +
        (it.impacto ? '<p class="impacto">' + esc(it.impacto) + "</p>" : "") +
        (it.ref ? '<div class="ref"><a href="' + esc(it.ref) + '" target="_blank" rel="noopener">fonte ↗</a></div>' : "") +
        (nova ? '<p class="impacto" style="color:#f59e0b">⚠ Aplique o snippet em <b>data.js</b> (logo/cor/grupo) e suba o <b>?v=</b> antes de aprovar, senão a pílula sai sem logo.</p>' : "") +
        '<div class="actions">' +
          '<button class="btn-ok">✓ Marco</button>' +
          '<button class="btn-sec" title="Publica só na régua ampliada (status secundario)">≡ Ampliada</button>' +
          '<button class="btn-no">✕ Rejeitar</button>' +
        "</div>" +
      "</div>";
  }

  // ── ação aprovar/rejeitar → POST text/plain (sem preflight CORS) ──
  var busy = false; // trava global: só uma ação por vez (evita clique duplo)

  // O Apps Script responde por um redirect entre domínios do Google que o navegador
  // muitas vezes não consegue ler — o fetch pode ficar pendurado. Por isso NÃO
  // confiamos na resposta do POST: disparamos e depois CONFIRMAMOS pelo estado real
  // (listar, ao vivo e sem cache). O card só some se a linha realmente saiu de Pendentes.
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, ms); })
    ]);
  }

  // nivel: "marco" (padrão, status publicado) ou "secundario" (só na régua ampliada)
  async function act(action, it, cardEl, nivel) {
    if (busy) return;
    busy = true;
    var secundario = nivel === "secundario";
    var btns = cardEl.querySelectorAll("button");
    var seletor = action !== "aprovar" ? ".btn-no" : (secundario ? ".btn-sec" : ".btn-ok");
    var clicked = cardEl.querySelector(seletor);
    var label = clicked.innerHTML; // guarda p/ restaurar se não confirmar
    btns.forEach(function (b) { b.disabled = true; });
    cardEl.classList.add("busy");
    clicked.innerHTML = '<span class="spinner"></span>Enviando…';

    var payload = { action: action, token: getToken(), data: it.date, empresa: it.emp, modelo: it.mod };
    if (secundario) payload.nivel = "secundario";

    // Dispara o POST. A resposta do Apps Script costuma ser ilegível (redirect do Google),
    // então NÃO dependemos dela — confirmamos pelo estado real (listar, ao vivo).
    try {
      await withTimeout(fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
      }), 30000);
    } catch (e) { /* timeout/CORS: o servidor pode estar processando — confirmamos abaixo */ }

    // Reconcilia: o card só some se a linha REALMENTE saiu de Pendentes.
    // (aprovar e rejeitar ambos removem de Pendentes, então o teste serve para os dois.)
    var norm = function (s) { return String(s).trim().toUpperCase(); };
    var alvo = it.date + "|" + norm(it.emp) + "|" + norm(it.mod);
    var prazos = [2000, 4000, 6000, 8000, 10000]; // tenta em intervalos crescentes (~30s total)
    var confirmou = false;
    for (var i = 0; i < prazos.length; i++) {
      clicked.innerHTML = '<span class="spinner"></span>Confirmando… (' + (i + 1) + "/" + prazos.length + ")";
      await new Promise(function (r) { setTimeout(r, prazos[i]); });
      var res;
      try { res = await webAppGet("listar"); } catch (e) { continue; }
      var ainda = (res && Array.isArray(res.candidatos))
        ? res.candidatos.some(function (c) { return (c.data + "|" + norm(c.empresa) + "|" + norm(c.modelo)) === alvo; })
        : false;
      if (!ainda) { confirmou = true; break; }
    }

    busy = false;
    if (confirmou) {
      clicked.innerHTML = action !== "aprovar" ? "✓ Rejeitado" : (secundario ? "✓ Na ampliada" : "✓ Publicado");
      cardEl.style.opacity = ".4";
      toast(action !== "aprovar" ? "✓ Rejeitado"
            : secundario ? "✓ Publicado como secundário (só na régua ampliada)"
                         : "✓ Aprovado e publicado como marco");
      setTimeout(function () {
        if (cardEl.parentNode) cardEl.parentNode.removeChild(cardEl);
        var n = listEl.querySelectorAll(".card").length;
        if (!n) { statusEl.textContent = ""; listEl.innerHTML = '<div class="empty">✅ Nenhum lançamento pendente.' + linksHtml() + "</div>"; }
        else statusEl.textContent = n + " pendente(s):";
      }, 900);
    } else {
      // A linha continua lá: o script ainda está processando (cold start) OU o POST falhou.
      clicked.innerHTML = label;
      cardEl.classList.remove("busy");
      btns.forEach(function (b) { b.disabled = false; });
      toast("Não confirmado ainda (processando?). Recarregue ↻ e tente de novo.", true);
    }
  }

  // ── token gate ──
  function askToken() {
    statusEl.textContent = "";
    listEl.innerHTML =
      '<div class="token-box">' +
        "<p>Cole o <b>token de curadoria</b> uma vez. Fica salvo neste aparelho (localStorage).</p>" +
        '<input id="tok" type="password" placeholder="token…" autocomplete="off">' +
        '<button class="btn-ok" id="saveTok">Salvar e entrar</button>' +
      "</div>";
    document.getElementById("saveTok").onclick = function () {
      var v = document.getElementById("tok").value.trim();
      if (!v) return;
      setToken(v);
      loadPendentes();
    };
  }

  // delegação dos botões dos cards
  listEl.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var cardEl = ev.target.closest(".card"); if (!cardEl) return;
    // recompõe o item a partir do DOM (robusto)
    var emp = cardEl.querySelector(".emp").textContent;
    var mod = cardEl.querySelector(".mod").textContent;
    var date = cardEl.querySelector(".date").textContent;
    var item = { emp: emp, mod: mod, date: date };
    if (b.classList.contains("btn-ok")) act("aprovar", item, cardEl, "marco");
    else if (b.classList.contains("btn-sec")) act("aprovar", item, cardEl, "secundario");
    else if (b.classList.contains("btn-no")) {
      if (confirm("Rejeitar e remover este pendente?\n\n" + emp + " · " + mod)) act("rejeitar", item, cardEl);
    }
  });

  document.getElementById("refresh").onclick = function () { getToken() ? loadPendentes() : askToken(); };

  // ── diagnóstico: mede a latência real do web app (cold start + exec) sem efeito colateral ──
  async function runDiag() {
    if (busy) return;
    toast("Testando web app…");
    var t0 = Date.now();
    var res;
    try { res = await webAppGet("ping"); }
    catch (e) { toast("Falha: " + e.message, true, 6000); return; }
    var rt = Date.now() - t0;
    toast("Web app " + rt + "ms · script " + (res && res.execMs != null ? res.execMs : "?") +
          "ms · pendentes " + (res && res.pendentesRows != null ? res.pendentesRows : "?"), false, 8000);
  }
  document.getElementById("diag").onclick = runDiag;

  // ── disparar a pesquisa de lançamentos (workflow do GitHub Actions, via Apps Script) ──
  async function buscarNovos() {
    if (busy) return;
    if (!confirm("Disparar a pesquisa de lançamentos agora?\n\n" +
                 "Ela busca modelos recentes e grava candidatos em Pendentes (você curadoria depois). " +
                 "Demora alguns minutos; o resultado chega por e-mail e aqui no app.")) return;
    busy = true;
    var btn = document.getElementById("buscar");
    var label = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Disparando…';
    var payload = { action: "rodar", token: getToken(), dry_run: "false" };
    var errMsg = "";
    try {
      var res = await withTimeout(fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
      }), 45000);
      try { var j = JSON.parse(await res.text()); if (j && j.ok === false) errMsg = j.error || "falhou"; } catch (e) { /* ilegível: assume disparado */ }
    } catch (e) { /* timeout/CORS: o servidor provavelmente disparou — confirmamos por e-mail/pendentes */ }
    busy = false;
    btn.innerHTML = label;
    btn.disabled = false;
    if (errMsg) { toast("Erro: " + errMsg, true, 9000); return; }
    toast("Pesquisa disparada. Em alguns minutos chegam e-mail + novos pendentes (dê ↻ daqui a pouco).", false, 9000);
  }
  document.getElementById("buscar").onclick = buscarNovos;

  // boot
  if (!SHEET_ID) { statusEl.textContent = "Erro: não consegui ler CONFIG.SHEET_ID de data.js."; }
  else if (!getToken()) { askToken(); }
  else { loadPendentes(); }

  // service worker
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>

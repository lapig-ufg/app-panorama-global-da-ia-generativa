name: Atualização automática de lançamentos

on:
  # Sem agendamento: roda só via dispatch manual (botão no PWA).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (só mostra no log, NÃO escreve na planilha)'
        type: boolean
        default: true

# O Claude só lê/escreve arquivos locais e pesquisa na web — não precisa escrever no repo.
# id-token: write é exigido pelo claude-code-action@v1 (usa OIDC).
permissions:
  contents: read
  id-token: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar prompt (lê a planilha)
        run: node automation/prepare.mjs

      # Pinado no SHA (= tag v1 em 10/ago/2026). A tag v1 é móvel: em 10/ago ela andou e
      # passou a falhar o job quando num_turns > --max-turns (claude-code-action#1607).
      - name: Pesquisar lançamentos (Claude)
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Leia o arquivo automation/_work/prompt.md e siga TODAS as instruções nele.
            Use WebSearch/WebFetch para pesquisar e escreva o resultado, no formato pedido,
            no arquivo automation/_work/candidates.json. Não edite nenhum outro arquivo e não rode git.
          # num_turns conta toda mensagem (inclusive retorno de ferramenta), não só turno do
          # assistente: os runs reais gastam 37-47. 80 dá folga e ainda barra loop infinito.
          claude_args: '--allowedTools "WebSearch,WebFetch,Read,Write" --max-turns 80 --model sonnet'

      - name: Validar e publicar
        env:
          # Real (escreve na planilha) só quando o dispatch manual vem com dry_run desmarcado.
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
        run: node automation/publish.mjs

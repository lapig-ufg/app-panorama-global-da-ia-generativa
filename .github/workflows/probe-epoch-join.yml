name: Sonda do cruzamento AA x Epoch AI

# Diagnóstico manual: mede se os benchmarks de raciocínio do Epoch AI (GPQA
# Diamond, HLE, CritPt, FrontierMath — CC BY) casam com os modelos que a chave
# free da Artificial Analysis devolve. Se casarem, a categoria "Pesquisa e
# raciocínio" do guia sobrevive sem assinatura Pro.
#
# NÃO grava nada, NÃO commita. Gasta 3 requisições da AA (free: 100/dia).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-epoch-join
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar os CSVs do Epoch AI
        run: |
          curl -sSfL https://epoch.ai/data/benchmark_data.zip -o epoch.zip
          mkdir -p epoch-data
          unzip -q -o epoch.zip -d epoch-data
          ls -la epoch-data | head -20

      - name: Cruzar as duas fontes
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node automation/probe-epoch-join.mjs epoch-data

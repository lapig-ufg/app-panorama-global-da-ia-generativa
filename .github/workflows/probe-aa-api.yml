name: Sonda da API da Artificial Analysis

# Diagnóstico manual: descobre o que a chave AA_API_KEY enxerga no contrato v2
# documentado, antes de migrar o pipeline para fora do endpoint legado
# (/api/v2/data/* é desligado em 4/nov/2026).
#
# NÃO grava nada, NÃO commita, NÃO publica. Só imprime nos logs.
# Gasta ~5 requisições do limite diário (free: 100/dia, reseta 00:00 UTC).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-aa-api
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sondar a API
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node automation/probe-aa-api.mjs

name: DEBUG schema AA

# Temporário: só imprime o schema da API para descobrir os nomes dos campos.
# Não escreve nem commita nada. Remover depois de corrigir o mapeamento.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Imprimir schema
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node automation/_debug-schema.mjs
